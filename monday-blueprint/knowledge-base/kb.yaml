# -----------------------------------------------------------------------------
# 3. KWALIFICATIEKENNIS  (verplichte velden die de AI altijd ophaalt)
# -----------------------------------------------------------------------------
qualification:
  required_fields:
    - {key: "zonnepanelen",   label: "Aantal zonnepanelen",            type: "integer"}
    - {key: "verbruik",       label: "Jaarlijks stroomverbruik (kWh)", type: "integer"}
    - {key: "opwek",          label: "Jaarlijkse opwek (kWh)",         type: "integer"}
    - {key: "teruglevering",  label: "Jaarlijkse teruglevering (kWh)", type: "integer"}
    - {key: "wp_per_paneel",  label: "Wp per paneel",                  type: "integer"}
    - {key: "fase",           label: "1-fase of 3-fase",               type: "enum", values: ["1-fase", "3-fase"]}
    - {key: "laadpaal",       label: "Laadpaal aanwezig",              type: "boolean"}
    - {key: "warmtepomp",     label: "Warmtepomp aanwezig",            type: "boolean"}
    - {key: "airco",          label: "Airco aanwezig",                 type: "boolean"}
    - {key: "meterkastfoto",  label: "Meterkastfoto",                  type: "file"}
    - {key: "email",          label: "Emailadres",                     type: "email"}
    - {key: "postcode",       label: "Postcode",                       type: "string"}
    - {key: "huisnummer",     label: "Huisnummer",                     type: "string"}

# -----------------------------------------------------------------------------
# 4. ADVIESLOGICA  (deterministisch — door n8n/AI identiek uit te voeren)
# -----------------------------------------------------------------------------
advice:
  module_capacity_kwh: 5.12        # 1 "stap" = 1 module
  never_oversize: true             # leidend principe: bij twijfel kleiner adviseren

  # 4a. Basisadvies op jaarlijks verbruik (kWh) -> aantal modules / kWh
  base_table:
    - {max_consumption: 5000,  modules: 1, advice_kwh: 5}
    - {max_consumption: 7500,  modules: 2, advice_kwh: 10}
    - {max_consumption: 10000, modules: 3, advice_kwh: 15}
    - {max_consumption: null,  modules: 4, advice_kwh: 20}   # > 10000

  # 4b. Correcties.
  #     mode "review" (DEFAULT, conform voorbeeld): correctie verhoogt NIET
  #       automatisch; zet review_flag=true zodat een adviseur beoordeelt.
  #       Voorbeeld 6000 kWh + warmtepomp + airco -> blijft 10 kWh (review).
  #     mode "additive": pas de regels letterlijk toe als +1 stap.
  corrections:
    mode: "review"                 # "review" | "additive"
    rules:
      - {key: "laadpaal",   when: "laadpaal == true",                 steps: 1}
      - {key: "warmtepomp", when: "warmtepomp == true",               steps: 1}
      - {key: "airco",      when: "airco == true && verbruik > 5000",  steps: 0, flag: "beoordelen"}

  # 4c. Omvormer-sizing op basis van geadviseerde batterijcapaciteit.
  #     Kies binnen het bereik de bovenkant bij laadpaal/warmtepomp (hogere piek).
  inverter_sizing:
    - {advice_kwh: 5,  recommended_kw_range: "5"}
    - {advice_kwh: 10, recommended_kw_range: "6-8"}
    - {advice_kwh: 15, recommended_kw_range: "8-10"}
    - {advice_kwh: 20, recommended_kw_range: "10-12"}

# -----------------------------------------------------------------------------
# 5. PRIJSKENNIS  (excl. BTW tenzij anders vermeld)
# -----------------------------------------------------------------------------
pricing:
  battery_module_eur: 660          # per module van 5.12 kWh

  inverter_eur:
    "1-fase":
      "3.6kW": 600
      "5kW": 640
      "6kW": 655
      "8kW": 900
      "10kW": 1300
      "12kW": 1330
    "3-fase":
      "5kW": 1270
      "6kW": 1290
      "8kW": 1330
      "10kW": 1395
      "12kW": 1465
      "15kW": 1615

  extras_eur:
    installatie: 1500
    sales: 750
    off_grid: 950
    meterkast_upgrade: 950
    ct_clamps: 150

# -----------------------------------------------------------------------------
# 6. WHATSAPP AI-INSTRUCTIE  (zie ook whatsapp-system-prompt.md)
# -----------------------------------------------------------------------------
whatsapp_prompt:
  language: "Nederlands"
  rules:
    - "Gebruik korte WhatsApp-berichten."
    - "Stel slechts één vraag tegelijk."
    - "Vraag nooit naar EMS."
    - "Vraag nooit naar noodstroom."
    - "Vraag nooit naar dynamische handel."
    - "Deze functies zijn standaard inbegrepen."
  opening_message: >
    Bedankt voor uw reactie op onze thuisbatterij advertentie op social media.
    Om uw situatie goed in kaart te brengen, mag ik vragen hoeveel zonnepanelen
    u heeft, wat uw jaarlijkse stroomverbruik is, wat uw zonnepanelen jaarlijks
    opwekken, hoeveel u jaarlijks teruglevert, en of u de wattage (Wp) per paneel weet?

# -----------------------------------------------------------------------------
# 7. SYSTEEM-MAPPINGS  (verbindt de SSOT met Monday + PandaDoc)
# -----------------------------------------------------------------------------
mappings:

  # Monday CRM-kolommen (board "Leads/Klanten"). type = aanbevolen Monday kolomtype.
  monday:
    board: "Leads"
    columns:
      - {name: "Naam",               source: "client.name",        type: "name"}
      - {name: "Telefoon",           source: "client.phone",       type: "phone"}
      - {name: "Email",              source: "client.email",       type: "email"}
      - {name: "Postcode",           source: "postcode",           type: "text"}
      - {name: "Huisnummer",         source: "huisnummer",         type: "text"}
      - {name: "Zonnepanelen",       source: "zonnepanelen",       type: "numbers"}
      - {name: "Wp_per_paneel",      source: "wp_per_paneel",      type: "numbers"}
      - {name: "Opwek",              source: "opwek",              type: "numbers"}
      - {name: "Verbruik",           source: "verbruik",           type: "numbers"}
      - {name: "Teruglevering",      source: "teruglevering",      type: "numbers"}
      - {name: "Fase",               source: "fase",               type: "status", labels: ["1-fase", "3-fase"]}
      - {name: "Laadpaal",           source: "laadpaal",           type: "status", labels: ["Ja", "Nee"]}
      - {name: "Warmtepomp",         source: "warmtepomp",         type: "status", labels: ["Ja", "Nee"]}
      - {name: "Airco",              source: "airco",              type: "status", labels: ["Ja", "Nee"]}
      - {name: "Meterkastfoto",      source: "meterkastfoto",      type: "file"}
      - {name: "Advies_Batterij",    source: "advice.battery_kwh", type: "text"}
      - {name: "Advies_Omvormer",    source: "advice.inverter_kw", type: "text"}
      - {name: "Prijs",              source: "price.total",        type: "numbers"}
      - {name: "Status",             source: "status",             type: "status",
         labels: ["Nieuw", "In gesprek", "Gekwalificeerd", "Offerte verzonden", "Afspraak ingepland", "Gewonnen", "Verloren"]}
      - {name: "Offerte_Verzonden",  source: "offerte_verzonden",  type: "status", labels: ["Ja", "Nee"]}
      - {name: "Afspraak_Ingepland", source: "afspraak_ingepland", type: "status", labels: ["Ja", "Nee"]}

  # PandaDoc-variabelen (offerte/contract).
  pandadoc:
    variables:
      - {var: "Client.Name",       source: "client.name"}
      - {var: "Client.Email",      source: "client.email"}
      - {var: "Client.Phone",      source: "client.phone"}
      - {var: "Client.Postcode",   source: "postcode"}
      - {var: "Client.Address",    source: "client.address"}
      - {var: "Client.City",       source: "client.city"}
      - {var: "Battery.Capacity",  source: "advice.battery_kwh"}
      - {var: "Battery.Modules",   source: "advice.modules"}
      - {var: "Inverter.Power",    source: "advice.inverter_kw"}
      - {var: "Inverter.Phase",    source: "fase"}
      - {var: "Price.Subtotal",    source: "price.subtotal"}
      - {var: "Price.VAT",         source: "price.vat"}
      - {var: "Price.Total",       source: "price.total"}
      - {var: "Installation.Date", source: "installation.date"}
      - {var: "Sales.Advisor",     source: "sales.advisor"}
