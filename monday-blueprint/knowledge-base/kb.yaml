# =============================================================================
# CENTRALE KENNISBRON (Single Source of Truth)
# Beste Partij BV — Deye thuisbatterijsystemen
# -----------------------------------------------------------------------------
# Dit YAML-bestand is de ENIGE bron van waarheid. Alle systemen lezen hieruit:
#   - WhatsApp AI-agent  : company, products, qualification, advice, whatsapp_prompt
#   - n8n                : advice (rules), pricing, mappings.monday, mappings.pandadoc
#   - Monday.com         : mappings.monday (kolommen) + statuses
#   - PandaDoc           : mappings.pandadoc (variabelen) + pricing
#
# Wijzig NOOIT prijzen/regels in een afzonderlijk systeem. Wijzig hier, en laat
# kb.json opnieuw genereren (zie knowledge-base/README.md -> "Build").
# =============================================================================

